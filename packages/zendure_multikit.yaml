# -----------------------------------------------------------------------------
# Capteurs calculés (⚠️ 2 capteurs à adapter en tête de liste)
# -----------------------------------------------------------------------------
template:
- sensor:
  - name: Zendure Compteur réseau
    unique_id: zendure_mk_compteur_reseau
    default_entity_id: sensor.zendure_compteur_reseau
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    state: |
      {#- ⚠️ À ADAPTER : ton compteur de puissance au point de livraison.
          Positif = tu consommes sur le réseau, négatif = tu exportes. -#}
      {%- set compteur = 'sensor.MON_COMPTEUR_RESEAU_PUISSANCE' -%}
      {{ states(compteur) | float(0) }}
    availability: |
      {%- set compteur = 'sensor.MON_COMPTEUR_RESEAU_PUISSANCE' -%}
      {{ is_number(states(compteur)) }}
  - name: Zendure Déduction hiver
    unique_id: zendure_mk_deduction_hiver
    default_entity_id: sensor.zendure_deduction_hiver
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    state: |
      {#- ⚠️ À ADAPTER : les gros consommateurs que la batterie ne doit PAS alimenter
          en mode hiver (four, plaques, lave-linge, radiateurs...). Liste vide = rien. -#}
      {%- set appareils = [
        'sensor.EXEMPLE_four_puissance',
        'sensor.EXEMPLE_lave_linge_puissance',
      ] -%}
      {%- set seuil = states('input_number.zendure_reglage_seuil_gros_conso') | float(30) -%}
      {%- set ns = namespace(total=0) -%}
      {%- for e in appareils -%}
        {%- set p = states(e) | float(0) -%}
        {%- if p > seuil -%}{%- set ns.total = ns.total + p -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.total | round(0) }}
  - name: Zendure Solaire total
    unique_id: zendure_mk_solaire_total
    default_entity_id: sensor.zendure_solaire_total
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    state: |
      {{ (states('sensor.zendure_kit1_solarinputpower') | float(0)) + (states('sensor.zendure_kit2_solarinputpower') | float(0)) + (states('sensor.zendure_kit3_solarinputpower') | float(0)) }}
  - name: Zendure Consigne idéale Kit 1
    unique_id: zendure_mk_consigne_kit1
    default_entity_id: sensor.zendure_consigne_ideale_kit1
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    state: |
      {% from 'zendure_multikit.jinja' import consigne_zendure %}
      {{ consigne_zendure('kit1') | float(0) | int }}
  - name: Zendure Heure calibrage Kit 1
    unique_id: zendure_mk_heure_calibrage_kit1
    default_entity_id: sensor.zendure_heure_calibrage_kit1
    icon: mdi:clock-start
    state: |
      {#- Heure de départ pour finir charge + décharge avant le lever du soleil -#}
      {%- set soc = states('sensor.zendure_kit1_electriclevel') | float(100) -%}
      {%- set cap = states('input_number.zendure_capacite_kit1') | float(1920) -%}
      {%- set p_ch = states('input_number.zendure_reglage_calibrage_charge') | float(800) -%}
      {%- set p_dech = states('input_number.zendure_reglage_calibrage_decharge') | float(250) -%}
      {%- set fin = states('input_number.zendure_reglage_calibrage_fin') | float(13) -%}
      {%- set t = cap * (100 - soc) / 100 / p_ch * 3600 + cap * (100 - fin) / 100 / p_dech * 3600 + 1800 -%}
      {%- set lever = as_timestamp(state_attr('sun.sun', 'next_rising'), 0) -%}
      {{ (lever - t) | timestamp_custom('%H:%M') if lever > 0 else '00:00' }}
  - name: Zendure Décompte calibrage Kit 1
    unique_id: zendure_mk_decompte_calibrage_kit1
    default_entity_id: sensor.zendure_decompte_calibrage_kit1
    unit_of_measurement: j
    icon: mdi:calendar-clock
    state: |
      {%- set intervalle = states('input_number.zendure_intervalle_calibrage') | int(35) -%}
      {%- set ts = as_timestamp(states('input_datetime.zendure_dernier_calibrage_kit1'), 0) -%}
      {{ (intervalle - ((as_timestamp(now()) - ts) / 86400) | int) if ts > 0 else 0 }}
  - name: Zendure Consigne idéale Kit 2
    unique_id: zendure_mk_consigne_kit2
    default_entity_id: sensor.zendure_consigne_ideale_kit2
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    state: |
      {% from 'zendure_multikit.jinja' import consigne_zendure %}
      {{ consigne_zendure('kit2') | float(0) | int }}
  - name: Zendure Heure calibrage Kit 2
    unique_id: zendure_mk_heure_calibrage_kit2
    default_entity_id: sensor.zendure_heure_calibrage_kit2
    icon: mdi:clock-start
    state: |
      {#- Heure de départ pour finir charge + décharge avant le lever du soleil -#}
      {%- set soc = states('sensor.zendure_kit2_electriclevel') | float(100) -%}
      {%- set cap = states('input_number.zendure_capacite_kit2') | float(1920) -%}
      {%- set p_ch = states('input_number.zendure_reglage_calibrage_charge') | float(800) -%}
      {%- set p_dech = states('input_number.zendure_reglage_calibrage_decharge') | float(250) -%}
      {%- set fin = states('input_number.zendure_reglage_calibrage_fin') | float(13) -%}
      {%- set t = cap * (100 - soc) / 100 / p_ch * 3600 + cap * (100 - fin) / 100 / p_dech * 3600 + 1800 -%}
      {%- set lever = as_timestamp(state_attr('sun.sun', 'next_rising'), 0) -%}
      {{ (lever - t) | timestamp_custom('%H:%M') if lever > 0 else '00:00' }}
  - name: Zendure Décompte calibrage Kit 2
    unique_id: zendure_mk_decompte_calibrage_kit2
    default_entity_id: sensor.zendure_decompte_calibrage_kit2
    unit_of_measurement: j
    icon: mdi:calendar-clock
    state: |
      {%- set intervalle = states('input_number.zendure_intervalle_calibrage') | int(35) -%}
      {%- set ts = as_timestamp(states('input_datetime.zendure_dernier_calibrage_kit2'), 0) -%}
      {{ (intervalle - ((as_timestamp(now()) - ts) / 86400) | int) if ts > 0 else 0 }}
  - name: Zendure Consigne idéale Kit 3
    unique_id: zendure_mk_consigne_kit3
    default_entity_id: sensor.zendure_consigne_ideale_kit3
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    state: |
      {% from 'zendure_multikit.jinja' import consigne_zendure %}
      {{ consigne_zendure('kit3') | float(0) | int }}
  - name: Zendure Heure calibrage Kit 3
    unique_id: zendure_mk_heure_calibrage_kit3
