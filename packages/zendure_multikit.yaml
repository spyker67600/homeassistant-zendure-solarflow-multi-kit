# =============================================================================
#  ZENDURE MULTI-KIT — Régulation zéro export pour 2 à 3 kits Zendure SolarFlow
#  Pilotage 100 % local (MQTT), sans cloud.
#  https://github.com/spyker67600/homeassistant-zendure-solarflow-multi-kit
#
#  INSTALLATION : voir docs/INSTALLATION.md. En résumé :
#   1. Renommer les appareils Zendure en « Zendure Kit1 / Kit2 / Kit3 »
#      (et les 3 capteurs de cellules en ..._pack_maxvol / _minvol / _batcur).
#   2. Copier ce fichier dans config/packages/ et zendure_multikit.jinja dans
#      config/custom_templates/.
#   3. Adapter les 3 lignes marquées ⚠️ À ADAPTER (compteur réseau,
#      gros consommateurs, téléphone pour les notifications).
#   4. Redémarrer Home Assistant, puis activer « Zendure Pilotage actif ».
#
#  Fichier généré — version 2.0.0
# =============================================================================

