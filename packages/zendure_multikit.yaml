- id: zendure_mk_calibrage_depart
  alias: Zendure - Départ nocturne du calibrage
  description: "À l'heure calculée (sensor.zendure_heure_calibrage_kitN), lance le calibrage d'un kit armé."
  mode: queued
  triggers:
  - trigger: template
    id: kit1
    value_template: "{{ now().strftime('%H:%M') == states('sensor.zendure_heure_calibrage_kit1') }}"
  - trigger: template
    id: kit2
    value_template: "{{ now().strftime('%H:%M') == states('sensor.zendure_heure_calibrage_kit2') }}"
  - trigger: template
    id: kit3
    value_template: "{{ now().strftime('%H:%M') == states('sensor.zendure_heure_calibrage_kit3') }}"
  actions:
  - condition: template
    value_template: "{{ is_state('input_boolean.zendure_armement_calibrage_' ~ trigger.id, 'on') and is_number(states('sensor.zendure_' ~ trigger.id ~ '_electriclevel')) }}"
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.zendure_armement_calibrage_{{ trigger.id }}
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.zendure_calibrage_{{ trigger.id }}
- id: zendure_mk_calibrage_armement_auto
  alias: Zendure - Armement automatique du calibrage
  description: "Si « Calibrage automatique » est activé, arme le calibrage d'un kit quand son décompte arrive à 0."
  mode: queued
  triggers:
  - trigger: numeric_state
    entity_id: sensor.zendure_decompte_calibrage_kit1
    below: 1
    id: kit1
  - trigger: numeric_state
    entity_id: sensor.zendure_decompte_calibrage_kit2
    below: 1
    id: kit2
  - trigger: numeric_state
    entity_id: sensor.zendure_decompte_calibrage_kit3
    below: 1
    id: kit3
  - trigger: time
    at: '12:00:00'
    id: midi
  conditions:
  - condition: state
    entity_id: input_boolean.zendure_calibrage_auto
    state: 'on'
  actions:
  - repeat:
      for_each:
      - kit1
      - kit2
      - kit3
      sequence:
      - if:
        - condition: template
          value_template: "{{ is_number(states('sensor.zendure_' ~ repeat.item ~ '_electriclevel')) and states('sensor.zendure_decompte_calibrage_' ~ repeat.item) | int(99) <= 0 and is_state('input_boolean.zendure_armement_calibrage_' ~ repeat.item, 'off') and is_state('input_boolean.zendure_calibrage_' ~ repeat.item, 'off') }}"
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.zendure_armement_calibrage_{{ repeat.item }}
- id: zendure_mk_calibrage_fin_filet
  alias: Zendure - Fin de calibrage (filet après redémarrage)
  description: 'Si HA a redémarré pendant un calibrage, termine proprement quand la jauge passe sous le seuil de fin : remet le Min SOC mémorisé.'
  mode: queued
  triggers:
  - trigger: numeric_state
    entity_id: sensor.zendure_kit1_electriclevel
    below: input_number.zendure_reglage_calibrage_fin
    id: kit1
  - trigger: numeric_state
    entity_id: sensor.zendure_kit2_electriclevel
    below: input_number.zendure_reglage_calibrage_fin
    id: kit2
  - trigger: numeric_state
    entity_id: sensor.zendure_kit3_electriclevel
    below: input_number.zendure_reglage_calibrage_fin
    id: kit3
  actions:
  - condition: template
    value_template: "{{ is_state('input_boolean.zendure_calibrage_' ~ trigger.id, 'on') }}"
  - action: input_number.set_value
    target:
      entity_id: input_number.zendure_cible_min_soc_{{ trigger.id }}
    data:
      value: "{{ states('input_number.zendure_memoire_min_soc_calibrage_' ~ trigger.id) | float(20) }}"
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.zendure_calibrage_{{ trigger.id }}
  - action: number.set_value
    target:
      entity_id: number.zendure_{{ trigger.id }}_outputlimit
    data:
      value: 0
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.zendure_dernier_calibrage_{{ trigger.id }}
    data:
      date: "{{ now().strftime('%Y-%m-%d') }}"
- id: zendure_mk_plausibilite_jauges
  alias: Zendure - Contrôle de plausibilité des jauges
  description: "Signale une jauge BMS suspecte : saut de 10 points ou plus sans charge (sauf vers 99-100 % ou 0-5 % : c'est le BMS qui se recale), ou jauge contredite par la tension des cellules au repos (≥ 95 % avec cellule max < 3,34 V, ou ≤ 15 % avec cellule min ≥ 3,28 V pendant 15 min). Un kit suspect est exclu du partage batterie. Se lève tout seul au prochain vrai plein ou vrai vide."
  mode: queued
  max: 10
  triggers:
  - trigger: state
    entity_id: sensor.zendure_kit1_electriclevel
    id: saut_kit1
  - trigger: state
    entity_id: sensor.zendure_kit2_electriclevel
    id: saut_kit2
  - trigger: state
    entity_id: sensor.zendure_kit3_electriclevel
    id: saut_kit3
  - trigger: template
    for: 00:15:00
    id: haut_kit1
    value_template: "{{ states('sensor.zendure_kit1_electriclevel') | float(0) >= 95 and states('sensor.zendure_kit1_pack_maxvol') | float(9) < 3.34 and states('sensor.zendure_kit1_pack_batcur') | float(99) | abs < 3 }}"
  - trigger: template
    for: 00:15:00
    id: haut_kit2
    value_template: "{{ states('sensor.zendure_kit2_electriclevel') | float(0) >= 95 and states('sensor.zendure_kit2_pack_maxvol') | float(9) < 3.34 and states('sensor.zendure_kit2_pack_batcur') | float(99) | abs < 3 }}"
  - trigger: template
    for: 00:15:00
    id: haut_kit3
    value_template: "{{ states('sensor.zendure_kit3_electriclevel') | float(0) >= 95 and states('sensor.zendure_kit3_pack_maxvol') | float(9) < 3.34 and states('sensor.zendure_kit3_pack_batcur') | float(99) | abs < 3 }}"
  - trigger: template
    for: 00:15:00
    id: bas_kit1
    value_template: "{{ is_number(states('sensor.zendure_kit1_electriclevel')) and states('sensor.zendure_kit1_electriclevel') | float(100) <= 15 and states('sensor.zendure_kit1_pack_minvol') | float(0) >= 3.28 and states('sensor.zendure_kit1_pack_batcur') | float(99) | abs < 3 }}"
  - trigger: template
    for: 00:15:00
    id: bas_kit2
    value_template: "{{ is_number(states('sensor.zendure_kit2_electriclevel')) and states('sensor.zendure_kit2_electriclevel') | float(100) <= 15 and states('sensor.zendure_kit2_pack_minvol') | float(0) >= 3.28 and states('sensor.zendure_kit2_pack_batcur') | float(99) | abs < 3 }}"
  - trigger: template
    for: 00:15:00
    id: bas_kit3
    value_template: "{{ is_number(states('sensor.zendure_kit3_electriclevel')) and states('sensor.zendure_kit3_electriclevel') | float(100) <= 15 and states('sensor.zendure_kit3_pack_minvol') | float(0) >= 3.28 and states('sensor.zendure_kit3_pack_batcur') | float(99) | abs < 3 }}"
  - trigger: numeric_state
    entity_id: sensor.zendure_kit1_pack_maxvol
    above: 3.5
    id: rhaut_kit1
  - trigger: numeric_state
    entity_id: sensor.zendure_kit2_pack_maxvol
    above: 3.5
    id: rhaut_kit2
  - trigger: numeric_state
    entity_id: sensor.zendure_kit3_pack_maxvol
    above: 3.5
    id: rhaut_kit3
  - trigger: numeric_state
    entity_id: sensor.zendure_kit1_pack_minvol
    below: 3
    id: rbas_kit1
  - trigger: numeric_state
    entity_id: sensor.zendure_kit2_pack_minvol
    below: 3
    id: rbas_kit2
  - trigger: numeric_state
    entity_id: sensor.zendure_kit3_pack_minvol
    below: 3
    id: rbas_kit3
  actions:
  - variables:
      kit: "{{ trigger.id.split('_')[1] }}"
      typ: "{{ trigger.id.split('_')[0] }}"
  - variables:
      flag: input_boolean.zendure_jauge_suspecte_{{ kit }}
      motif: input_text.zendure_jauge_motif_{{ kit }}
      heure: "{{ now().strftime('%d/%m %H:%M') }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{% set f = trigger.from_state.state | float(0) %}{% set t = trigger.to_state.state | float(0) %}{{ typ == 'saut' and is_number(trigger.from_state.state) and is_number(trigger.to_state.state) and (t - f) | abs >= 10 and states('sensor.zendure_' ~ kit ~ '_outputpackpower') | float(0) < 100 and not (t >= 99 and t > f) and not (t <= 5 and t < f) }}"
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: '{{ flag }}'
      - action: input_text.set_value
        target:
          entity_id: '{{ motif }}'
        data:
          value: Saut {{ trigger.from_state.state | int }} → {{ trigger.to_state.state | int }} % le {{ heure }} sans charge
      - action: script.turn_on
        target:
          entity_id: script.zendure_notifier
        data:
          variables:
            titre: Jauge {{ kit }} suspecte
            message: "Saut de {{ trigger.from_state.state | int }} à {{ trigger.to_state.state | int }} % sans charge ({{ heure }}). Kit exclu de la décharge jusqu'au prochain vrai plein."
            notification_id: jauge_{{ kit }}
    - alias: 'Recalage BMS : un saut vers 99-100 % ou vers 0-5 % est le BMS qui se recale, pas une erreur'
      conditions:
      - condition: template
        value_template: "{% set f = trigger.from_state.state | float(0) %}{% set t = trigger.to_state.state | float(0) %}{{ typ == 'saut' and is_number(trigger.from_state.state) and is_number(trigger.to_state.state) and (t - f) | abs >= 10 and ((t >= 99 and t > f) or (t <= 5 and t < f)) }}"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: '{{ flag }}'
      - action: input_text.set_value
        target:
          entity_id: '{{ motif }}'
        data:
          value: RAS (recalage BMS {{ trigger.from_state.state | int }} → {{ trigger.to_state.state | int }} % le {{ heure }})
      - action: persistent_notification.dismiss
        data:
          notification_id: jauge_{{ kit }}
    - conditions:
      - condition: template
        value_template: "{{ typ in ['haut', 'bas'] }}"
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: '{{ flag }}'
      - action: input_text.set_value
        target:
          entity_id: '{{ motif }}'
        data:
          value: "{{ 'Jauge haute mais tension basse' if typ == 'haut' else 'Jauge basse mais tension haute' }} ({{ heure }})"
      - action: script.turn_on
        target:
          entity_id: script.zendure_notifier
        data:
          variables:
            titre: Jauge {{ kit }} suspecte
            message: "{{ 'Jauge ≥ 95 % alors que les cellules sont sous 3,34 V au repos.' if typ == 'haut' else 'Jauge ≤ 15 % alors que les cellules sont ≥ 3,28 V au repos.' }} ({{ heure }})"
            notification_id: jauge_{{ kit }}
    - conditions:
      - condition: template
        value_template: "{{ typ in ['rhaut', 'rbas'] and is_state(flag, 'on') }}"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: '{{ flag }}'
      - action: input_text.set_value
        target:
          entity_id: '{{ motif }}'
        data:
          value: "Recalée {{ 'par le haut (vrai plein)' if typ == 'rhaut' else 'par le bas (vrai vide)' }} le {{ heure }}"
      - action: persistent_notification.dismiss
        data:
          notification_id: jauge_{{ kit }}
- id: zendure_mk_alerte_kit_muet
  alias: Zendure - Alerte kit muet (MQTT)
  description: "Prévient si un kit ne remonte plus en MQTT depuis 15 min (le Pilotage l'exclut déjà), et quand il revient."
  mode: queued
  triggers:
  - trigger: state
    entity_id:
    - sensor.zendure_kit1_electriclevel
    - sensor.zendure_kit2_electriclevel
    - sensor.zendure_kit3_electriclevel
    to:
    - unavailable
    - unknown
    for: 00:15:00
    id: muet
  - trigger: state
    entity_id:
    - sensor.zendure_kit1_electriclevel
    - sensor.zendure_kit2_electriclevel
    - sensor.zendure_kit3_electriclevel
    from:
    - unavailable
    - unknown
    id: retour
  actions:
  - variables:
      kit: "{{ trigger.entity_id.split('.')[1].split('_')[1] }}"
  - choose:
    - conditions:
      - condition: trigger
        id: muet
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.zendure_notifier
        data:
          variables:
            titre: Zendure {{ kit }} muet
            message: "Plus de remontée MQTT depuis 15 min ({{ now().strftime('%d/%m %H:%M') }}). Kit exclu du pilotage. Vérifier WiFi / hub."
            notification_id: kit_muet_{{ kit }}
    - conditions:
      - condition: trigger
        id: retour
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: kit_muet_{{ kit }}
- id: zendure_mk_chien_de_garde_compteur
  alias: Zendure - Chien de garde compteur réseau
  description: 'Compteur réseau indisponible 1 min : Pilotage coupé, kits bridés à 50 W. Relance automatique au retour.'
  mode: restart
  triggers:
  - trigger: state
    entity_id: sensor.zendure_compteur_reseau
    to:
    - unavailable
    - unknown
    for: 00:01:00
    id: perte
  - trigger: template
    value_template: "{{ is_number(states('sensor.zendure_compteur_reseau')) }}"
    for: 00:01:00
    id: retour
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: perte
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.zendure_pilotage_global
        data:
          stop_actions: true
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id:
          - number.zendure_kit1_outputlimit
          - number.zendure_kit2_outputlimit
          - number.zendure_kit3_outputlimit
        data:
          value: 50
      - action: script.turn_on
        target:
          entity_id: script.zendure_notifier
        data:
          variables:
            titre: ⚠️ Sécurité Zendure
            message: Compteur réseau perdu. Pilotage coupé, kits bridés à 50 W.
            notification_id: zendure_compteur
    - conditions:
      - condition: trigger
        id: retour
      sequence:
      - action: automation.turn_on
        target:
          entity_id: automation.zendure_pilotage_global
      - action: persistent_notification.dismiss
        data:
          notification_id: zendure_compteur
- id: zendure_mk_commutations
  alias: Zendure - Compteurs de commutations relais
  description: "Compte les bascules de mode AC et d'export (usure des relais). Remise à zéro à minuit."
  mode: queued
  max: 10
  triggers:
  - trigger: state
    entity_id: select.zendure_kit1_acmode
    id: kit1_ac_mode
  - trigger: state
    entity_id: select.zendure_kit2_acmode
    id: kit2_ac_mode
  - trigger: state
    entity_id: select.zendure_kit3_acmode
    id: kit3_ac_mode
  - trigger: state
    entity_id: select.zendure_kit1_gridreverse
    id: kit1_grid_reverse
  - trigger: state
    entity_id: select.zendure_kit2_gridreverse
    id: kit2_grid_reverse
  - trigger: state
    entity_id: select.zendure_kit3_gridreverse
    id: kit3_grid_reverse
  - trigger: time
    at: 00:00:00
    id: minuit
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: minuit
      sequence:
      - action: counter.reset
        target:
          entity_id:
          - counter.zendure_commutations_kit1_ac_mode
          - counter.zendure_commutations_kit1_grid_reverse
          - counter.zendure_commutations_kit2_ac_mode
          - counter.zendure_commutations_kit2_grid_reverse
          - counter.zendure_commutations_kit3_ac_mode
          - counter.zendure_commutations_kit3_grid_reverse
    default:
    - condition: template
      value_template: "{{ trigger.from_state is not none and trigger.from_state.state not in ['unavailable', 'unknown'] and trigger.to_state.state not in ['unavailable', 'unknown'] }}"
    - action: counter.increment
      target:
        entity_id: counter.zendure_commutations_{{ trigger.id }}
