- id: zendure_mk_calibrage_kit2
  alias: Zendure - Calibrage LFP Kit 2
  description: "Charge forcée jusqu'au vrai plein (cellule > 3,50 V, ou jauge 99 % + courant faible + cellule ≥ 3,45 V pendant 5 min), puis décharge lente jusqu'au seuil de fin pour recaler la jauge du BMS. Puissances et seuil : réglages « Calibrage ». Sans vrai plein en 10 h, tout est remis en place."
  mode: single
  triggers:
  - trigger: state
    entity_id: input_boolean.zendure_calibrage_kit2
    to: 'on'
  actions:
  - variables:
      soc_memo: "{{ states('input_number.zendure_cible_min_soc_kit2') | float(20) }}"
  - alias: Mémoriser le Min SOC (survit à un redémarrage)
    action: input_number.set_value
    target:
      entity_id: input_number.zendure_memoire_min_soc_calibrage_kit2
    data:
      value: '{{ soc_memo }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.zendure_cible_min_soc_kit2
    data:
      value: 10
  - action: number.set_value
    target:
      entity_id: number.zendure_kit2_minsoc
    data:
      value: 10
  - action: number.set_value
    target:
      entity_id: number.zendure_kit2_outputlimit
    data:
      value: 0
  - action: select.select_option
    target:
      entity_id: select.zendure_kit2_acmode
    data:
      option: Input mode
  - action: number.set_value
    target:
      entity_id: number.zendure_kit2_inputlimit
    data:
      value: "{{ states('input_number.zendure_reglage_calibrage_charge') | int(800) }}"
  - alias: Attente du vrai plein (tension cellule, pas la jauge)
    wait_for_trigger:
    - trigger: numeric_state
      entity_id: sensor.zendure_kit2_pack_maxvol
      above: 3.5
    - trigger: template
      for: 00:05:00
      value_template: "{{ states('sensor.zendure_kit2_electriclevel') | float(0) >= 99 and states('sensor.zendure_kit2_outputpackpower') | float(0) < 30 and states('sensor.zendure_kit2_pack_maxvol') | float(0) >= 3.45 }}"
    timeout: '10:00:00'
    continue_on_timeout: true
  - alias: 'Pas de vrai plein en 10 h : on remet tout en place'
    if:
    - condition: template
      value_template: '{{ wait.trigger is none }}'
    then:
    - action: number.set_value
      target:
        entity_id: number.zendure_kit2_inputlimit
      data:
        value: 0
    - action: select.select_option
      target:
        entity_id: select.zendure_kit2_acmode
      data:
        option: Output mode
    - action: input_number.set_value
      target:
        entity_id: input_number.zendure_cible_min_soc_kit2
      data:
        value: '{{ soc_memo }}'
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.zendure_calibrage_kit2
    - action: script.turn_on
      target:
        entity_id: script.zendure_notifier
      data:
        variables:
          titre: Calibrage Kit 2 abandonné
          message: Vrai plein non atteint en 10 h (cellule < 3,50 V). Réglages remis en place.
          notification_id: calibrage_kit2
    - stop: Calibrage abandonné
  - alias: 'Vrai plein atteint : la jauge est recalée, on lève le drapeau suspect'
    sequence:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.zendure_jauge_suspecte_kit2
    - action: input_text.set_value
      target:
        entity_id: input_text.zendure_jauge_motif_kit2
      data:
        value: "RAS (calibré le {{ now().strftime('%d/%m %H:%M') }})"
    - action: persistent_notification.dismiss
      data:
        notification_id: jauge_kit2
  - action: number.set_value
    target:
      entity_id: number.zendure_kit2_inputlimit
    data:
      value: 0
  - action: select.select_option
    target:
      entity_id: select.zendure_kit2_acmode
    data:
      option: Output mode
  - action: number.set_value
    target:
      entity_id: number.zendure_kit2_outputlimit
    data:
      value: "{{ states('input_number.zendure_reglage_calibrage_decharge') | int(250) }}"
  - wait_for_trigger:
    - trigger: numeric_state
      entity_id: sensor.zendure_kit2_electriclevel
      below: input_number.zendure_reglage_calibrage_fin
    timeout: '15:00:00'
    continue_on_timeout: true
  - action: input_number.set_value
    target:
      entity_id: input_number.zendure_cible_min_soc_kit2
    data:
      value: '{{ soc_memo }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.zendure_calibrage_kit2
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.zendure_dernier_calibrage_kit2
    data:
      date: "{{ now().strftime('%Y-%m-%d') }}"
