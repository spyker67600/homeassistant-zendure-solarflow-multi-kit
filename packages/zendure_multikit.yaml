              continue_on_error: true
              target:
                entity_id: number.zendure_kit3_outputlimit
              data:
                value: '{{ safe_kit3 }}'
  - delay:
      seconds: 1
- id: zendure_mk_bypass
  alias: Zendure - Hystérésis bypass
  description: 'Batterie pleine (seuil ON) : le kit passe en bypass. Libéré sous le seuil OFF. Évite les claquements de relais.'
  mode: queued
  triggers:
  - trigger: numeric_state
    entity_id: sensor.zendure_kit1_electriclevel
    above: input_number.zendure_reglage_bypass_on
    id: on_kit1
  - trigger: numeric_state
    entity_id: sensor.zendure_kit1_electriclevel
    below: input_number.zendure_reglage_bypass_off
    id: off_kit1
  - trigger: numeric_state
    entity_id: sensor.zendure_kit2_electriclevel
    above: input_number.zendure_reglage_bypass_on
    id: on_kit2
  - trigger: numeric_state
    entity_id: sensor.zendure_kit2_electriclevel
    below: input_number.zendure_reglage_bypass_off
    id: off_kit2
  - trigger: numeric_state
    entity_id: sensor.zendure_kit3_electriclevel
    above: input_number.zendure_reglage_bypass_on
    id: on_kit3
  - trigger: numeric_state
    entity_id: sensor.zendure_kit3_electriclevel
    below: input_number.zendure_reglage_bypass_off
    id: off_kit3
  actions:
  - if:
    - condition: template
      value_template: "{{ trigger.id.startswith('on_') }}"
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: "input_boolean.zendure_bypass_{{ trigger.id.split('_')[1] }}"
    else:
    - action: input_boolean.turn_off
      target:
        entity_id: "input_boolean.zendure_bypass_{{ trigger.id.split('_')[1] }}"
- id: zendure_mk_arbitre_maitre
  alias: Zendure - Arbitre kit maître solaire
  description: "Le kit qui produit le plus devient maître, seulement s'il dépasse l'actuel de 100 W (hystérésis)."
  mode: single
  triggers:
  - trigger: state
    entity_id:
    - sensor.zendure_kit1_solarinputpower
    - sensor.zendure_kit2_solarinputpower
    - sensor.zendure_kit3_solarinputpower
  variables:
    pvs: "{{ {'kit1': states('sensor.zendure_kit1_solarinputpower') | float(0), 'kit2': states('sensor.zendure_kit2_solarinputpower') | float(0), 'kit3': states('sensor.zendure_kit3_solarinputpower') | float(0)} }}"
    maitre: "{{ states('input_select.zendure_kit_maitre') }}"
    meilleur: "{{ (pvs | dictsort(false, 'value') | last)[0] }}"
  conditions:
  - condition: template
    value_template: '{{ meilleur != maitre and (pvs[meilleur] - pvs.get(maitre, 0)) > 100 }}'
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.zendure_kit_maitre
    data:
      option: '{{ meilleur }}'
- id: zendure_mk_filet_securite
  alias: Zendure - Filet de sécurité (sous 6 %)
  description: "Un kit passe sous 6 % : recharge réseau à 400 W jusqu'à 10 %. Le Pilotage le laisse faire."
  mode: parallel
  max: 3
  triggers:
  - trigger: numeric_state
    entity_id: sensor.zendure_kit1_electriclevel
    below: 6
    id: kit1
  - trigger: numeric_state
    entity_id: sensor.zendure_kit2_electriclevel
    below: 6
    id: kit2
  - trigger: numeric_state
    entity_id: sensor.zendure_kit3_electriclevel
    below: 6
    id: kit3
  actions:
  - variables:
      kit: '{{ trigger.id }}'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.zendure_charge_urgence_{{ kit }}
  - action: number.set_value
    target:
      entity_id: number.zendure_{{ kit }}_outputlimit
    data:
      value: 0
  - action: number.set_value
    target:
      entity_id: number.zendure_{{ kit }}_inputlimit
    data:
      value: 400
  - action: select.select_option
    target:
      entity_id: select.zendure_{{ kit }}_acmode
    data:
      option: Input mode
  - wait_template: "{{ states('sensor.zendure_' ~ kit ~ '_electriclevel') | float(0) >= 10 }}"
    timeout: 02:00:00
  - action: number.set_value
    target:
      entity_id: number.zendure_{{ kit }}_inputlimit
    data:
      value: 0
  - action: select.select_option
    target:
      entity_id: select.zendure_{{ kit }}_acmode
    data:
      option: Output mode
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.zendure_charge_urgence_{{ kit }}
- id: zendure_mk_soc_min_differe
  alias: Zendure - Min SOC différé
  description: "Envoie le Min SOC au boîtier seulement quand la batterie l'a atteint, pour ne pas forcer une recharge réseau."
  mode: queued
  triggers:
  - trigger: state
    entity_id:
    - input_number.zendure_cible_min_soc_kit1
    - sensor.zendure_kit1_electriclevel
    id: kit1
  - trigger: state
    entity_id:
    - input_number.zendure_cible_min_soc_kit2
    - sensor.zendure_kit2_electriclevel
    id: kit2
  - trigger: state
    entity_id:
    - input_number.zendure_cible_min_soc_kit3
    - sensor.zendure_kit3_electriclevel
    id: kit3
  actions:
  - variables:
      kit: '{{ trigger.id }}'
      cible: "{{ states('input_number.zendure_cible_min_soc_' ~ trigger.id) | int(0) }}"
  - condition: template
    value_template: "{{ is_state('input_boolean.zendure_calibrage_' ~ kit, 'off') }}"
  - condition: template
    value_template: "{{ states('sensor.zendure_' ~ kit ~ '_electriclevel') | int(0) >= cible }}"
  - condition: template
    value_template: "{{ states('number.zendure_' ~ kit ~ '_minsoc') | int(0) != cible }}"
  - action: number.set_value
    target:
      entity_id: number.zendure_{{ kit }}_minsoc
    data:
      value: '{{ cible }}'
- id: zendure_mk_calibrage_kit1
  alias: Zendure - Calibrage LFP Kit 1
  description: "Charge forcée jusqu'au vrai plein (cellule > 3,50 V, ou jauge 99 % + courant faible + cellule ≥ 3,45 V pendant 5 min), puis décharge lente jusqu'au seuil de fin pour recaler la jauge du BMS. Puissances et seuil : réglages « Calibrage ». Sans vrai plein en 10 h, tout est remis en place."
  mode: single
  triggers:
  - trigger: state
    entity_id: input_boolean.zendure_calibrage_kit1
    to: 'on'
  actions:
  - variables:
      soc_memo: "{{ states('input_number.zendure_cible_min_soc_kit1') | float(20) }}"
  - alias: Mémoriser le Min SOC (survit à un redémarrage)
    action: input_number.set_value
    target:
      entity_id: input_number.zendure_memoire_min_soc_calibrage_kit1
    data:
      value: '{{ soc_memo }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.zendure_cible_min_soc_kit1
    data:
      value: 10
  - action: number.set_value
    target:
      entity_id: number.zendure_kit1_minsoc
    data:
      value: 10
  - action: number.set_value
    target:
      entity_id: number.zendure_kit1_outputlimit
    data:
      value: 0
  - action: select.select_option
    target:
      entity_id: select.zendure_kit1_acmode
    data:
      option: Input mode
  - action: number.set_value
    target:
      entity_id: number.zendure_kit1_inputlimit
    data:
      value: "{{ states('input_number.zendure_reglage_calibrage_charge') | int(800) }}"
  - alias: Attente du vrai plein (tension cellule, pas la jauge)
    wait_for_trigger:
    - trigger: numeric_state
      entity_id: sensor.zendure_kit1_pack_maxvol
      above: 3.5
    - trigger: template
      for: 00:05:00
      value_template: "{{ states('sensor.zendure_kit1_electriclevel') | float(0) >= 99 and states('sensor.zendure_kit1_outputpackpower') | float(0) < 30 and states('sensor.zendure_kit1_pack_maxvol') | float(0) >= 3.45 }}"
    timeout: '10:00:00'
    continue_on_timeout: true
  - alias: 'Pas de vrai plein en 10 h : on remet tout en place'
    if:
    - condition: template
      value_template: '{{ wait.trigger is none }}'
    then:
    - action: number.set_value
      target:
        entity_id: number.zendure_kit1_inputlimit
      data:
        value: 0
    - action: select.select_option
      target:
        entity_id: select.zendure_kit1_acmode
      data:
        option: Output mode
    - action: input_number.set_value
      target:
        entity_id: input_number.zendure_cible_min_soc_kit1
      data:
        value: '{{ soc_memo }}'
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.zendure_calibrage_kit1
    - action: script.turn_on
      target:
        entity_id: script.zendure_notifier
      data:
        variables:
          titre: Calibrage Kit 1 abandonné
          message: Vrai plein non atteint en 10 h (cellule < 3,50 V). Réglages remis en place.
          notification_id: calibrage_kit1
    - stop: Calibrage abandonné
  - alias: 'Vrai plein atteint : la jauge est recalée, on lève le drapeau suspect'
    sequence:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.zendure_jauge_suspecte_kit1
    - action: input_text.set_value
      target:
        entity_id: input_text.zendure_jauge_motif_kit1
      data:
        value: "RAS (calibré le {{ now().strftime('%d/%m %H:%M') }})"
    - action: persistent_notification.dismiss
      data:
        notification_id: jauge_kit1
  - action: number.set_value
    target:
      entity_id: number.zendure_kit1_inputlimit
    data:
      value: 0
  - action: select.select_option
    target:
      entity_id: select.zendure_kit1_acmode
    data:
      option: Output mode
  - action: number.set_value
    target:
      entity_id: number.zendure_kit1_outputlimit
    data:
      value: "{{ states('input_number.zendure_reglage_calibrage_decharge') | int(250) }}"
  - wait_for_trigger:
    - trigger: numeric_state
      entity_id: sensor.zendure_kit1_electriclevel
      below: input_number.zendure_reglage_calibrage_fin
    timeout: '15:00:00'
    continue_on_timeout: true
