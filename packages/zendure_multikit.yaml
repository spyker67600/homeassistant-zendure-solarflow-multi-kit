# -----------------------------------------------------------------------------
# Notification (⚠️ à adapter)
# -----------------------------------------------------------------------------
script:
  zendure_notifier:
    alias: Zendure - Notifier
    description: "Point unique de notification du package : notification dans HA, et sur ton téléphone si tu l'indiques ci-dessous."
    mode: queued
    max: 20
    icon: mdi:bell-ring
    fields:
      titre:
        description: Titre
      message:
        description: Message
      notification_id:
        description: Identifiant (pour remplacer/effacer)
    variables:
      telephone: |
        {#- ⚠️ À ADAPTER (facultatif) : ton service de notification téléphone,
            ex. 'notify.mobile_app_mon_telephone'. Laisser '' = notification HA seulement. -#}
        {{ '' }}
    sequence:
    - action: persistent_notification.create
      data:
        title: '{{ titre }}'
        message: '{{ message }}'
        notification_id: "{{ notification_id | default('zendure') }}"
    - if:
      - condition: template
        value_template: "{{ telephone | trim != '' }}"
      then:
      - action: '{{ telephone | trim }}'
        continue_on_error: true
        data:
          title: '{{ titre }}'
          message: '{{ message }}'

# -----------------------------------------------------------------------------
# Automatisations
# -----------------------------------------------------------------------------
automation:
- id: zendure_mk_pilotage_global
  alias: Zendure - Pilotage global
  description: "Cœur de la régulation. Applique les consignes idéales (sensor.zendure_consigne_ideale_kitN) aux kits, gère la recharge réseau en renfort quand un kit est en bypass, et ignore les kits en calibrage, en charge d'urgence ou muets. N'envoie un ordre que si l'écart dépasse le réglage « Écart mini avant ordre »."
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: state
    entity_id: sensor.zendure_compteur_reseau
  - trigger: state
    entity_id: sensor.zendure_solaire_total
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: state
    entity_id: input_boolean.zendure_pilotage_actif
    state: 'on'
  actions:
  - variables:
      reseau: "{{ states('sensor.zendure_compteur_reseau') | float(0) }}"
      urg_kit1: "{{ is_state('input_boolean.zendure_charge_urgence_kit1', 'on') or is_state('input_boolean.zendure_calibrage_kit1', 'on') or states('sensor.zendure_kit1_electriclevel') in ['unavailable', 'unknown'] }}"
      urg_kit2: "{{ is_state('input_boolean.zendure_charge_urgence_kit2', 'on') or is_state('input_boolean.zendure_calibrage_kit2', 'on') or states('sensor.zendure_kit2_electriclevel') in ['unavailable', 'unknown'] }}"
      urg_kit3: "{{ is_state('input_boolean.zendure_charge_urgence_kit3', 'on') or is_state('input_boolean.zendure_calibrage_kit3', 'on') or states('sensor.zendure_kit3_electriclevel') in ['unavailable', 'unknown'] }}"
      pv_kit1: "{{ states('sensor.zendure_kit1_solarinputpower') | float(0) if not urg_kit1 else 0 }}"
      pv_kit2: "{{ states('sensor.zendure_kit2_solarinputpower') | float(0) if not urg_kit2 else 0 }}"
      pv_kit3: "{{ states('sensor.zendure_kit3_solarinputpower') | float(0) if not urg_kit3 else 0 }}"
      ac_kit1: "{{ states('sensor.zendure_kit1_gridinputpower') | float(0) if not urg_kit1 else 0 }}"
      ac_kit2: "{{ states('sensor.zendure_kit2_gridinputpower') | float(0) if not urg_kit2 else 0 }}"
      ac_kit3: "{{ states('sensor.zendure_kit3_gridinputpower') | float(0) if not urg_kit3 else 0 }}"
      ac_total: '{{ ac_kit1 + ac_kit2 + ac_kit3 }}'
      surplus_brut: '{{ (ac_total - reseau + 20) | round(0) if ac_total > 0 else (ac_total - reseau - 15) | round(0) }}'
      surplus_net: '{{ surplus_brut if surplus_brut > 0 else 0 }}'
      soc_kit1: "{{ states('sensor.zendure_kit1_electriclevel') | float(0) if not urg_kit1 else 0 }}"
      soc_kit2: "{{ states('sensor.zendure_kit2_electriclevel') | float(0) if not urg_kit2 else 0 }}"
      soc_kit3: "{{ states('sensor.zendure_kit3_electriclevel') | float(0) if not urg_kit3 else 0 }}"
      ideal_kit1: "{{ states('sensor.zendure_consigne_ideale_kit1') | float(0) }}"
      ideal_kit2: "{{ states('sensor.zendure_consigne_ideale_kit2') | float(0) }}"
      ideal_kit3: "{{ states('sensor.zendure_consigne_ideale_kit3') | float(0) }}"
      solaire_total: "{{ states('sensor.zendure_solaire_total') | float(0) }}"
      besoin_total: '{{ ideal_kit1 + ideal_kit2 + ideal_kit3 }}'
      avail_ideal: '{{ (ideal_kit1 if not urg_kit1 else 0) + (ideal_kit2 if not urg_kit2 else 0) + (ideal_kit3 if not urg_kit3 else 0) }}'
      forced_kit1: "{{ states('number.zendure_kit1_outputlimit') | float(0) if urg_kit1 and states('number.zendure_kit1_outputlimit') not in ['unavailable', 'unknown'] else 0 }}"
      forced_kit2: "{{ states('number.zendure_kit2_outputlimit') | float(0) if urg_kit2 and states('number.zendure_kit2_outputlimit') not in ['unavailable', 'unknown'] else 0 }}"
      forced_kit3: "{{ states('number.zendure_kit3_outputlimit') | float(0) if urg_kit3 and states('number.zendure_kit3_outputlimit') not in ['unavailable', 'unknown'] else 0 }}"
      rem_need: '{{ besoin_total - (forced_kit1 + forced_kit2 + forced_kit3) }}'
      is_cal: '{{ urg_kit1 or urg_kit2 or urg_kit3 }}'
      inj_kit1: '{% if not is_cal %}{{ ideal_kit1 }}{% elif urg_kit1 %}{{ ideal_kit1 }}{% elif avail_ideal > 0 and rem_need > 0 %}{{ ((ideal_kit1 / avail_ideal) * rem_need) | round(0) }}{% else %}0{% endif %}'
      inj_kit2: '{% if not is_cal %}{{ ideal_kit2 }}{% elif urg_kit2 %}{{ ideal_kit2 }}{% elif avail_ideal > 0 and rem_need > 0 %}{{ ((ideal_kit2 / avail_ideal) * rem_need) | round(0) }}{% else %}0{% endif %}'
      inj_kit3: '{% if not is_cal %}{{ ideal_kit3 }}{% elif urg_kit3 %}{{ ideal_kit3 }}{% elif avail_ideal > 0 and rem_need > 0 %}{{ ((ideal_kit3 / avail_ideal) * rem_need) | round(0) }}{% else %}0{% endif %}'
      cible_kit1: "{{ states('input_number.zendure_cible_min_soc_kit1') | float(10) }}"
      cible_kit2: "{{ states('input_number.zendure_cible_min_soc_kit2') | float(10) }}"
      cible_kit3: "{{ states('input_number.zendure_cible_min_soc_kit3') | float(10) }}"
      safe_kit1: '{{ 0 if soc_kit1 <= (cible_kit1 + 1) else ([inj_kit1, pv_kit1, 800] | min if ac_total > 0 else [inj_kit1, 800] | min) }}'
      safe_kit2: '{{ 0 if soc_kit2 <= (cible_kit2 + 1) else ([inj_kit2, pv_kit2, 800] | min if ac_total > 0 else [inj_kit2, 800] | min) }}'
      safe_kit3: '{{ 0 if soc_kit3 <= (cible_kit3 + 1) else ([inj_kit3, pv_kit3, 800] | min if ac_total > 0 else [inj_kit3, 800] | min) }}'
      bypass_actif: "{{ is_state('input_boolean.zendure_bypass_kit1', 'on') or is_state('input_boolean.zendure_bypass_kit2', 'on') or is_state('input_boolean.zendure_bypass_kit3', 'on') }}"
      list_socs: "{% set ns = namespace(l=[]) %}{% if soc_kit1 < 98 and not is_state('input_boolean.zendure_bypass_kit1', 'on') and not urg_kit1 %}{% set ns.l = ns.l + [soc_kit1] %}{% endif %}{% if soc_kit2 < 98 and not is_state('input_boolean.zendure_bypass_kit2', 'on') and not urg_kit2 %}{% set ns.l = ns.l + [soc_kit2] %}{% endif %}{% if soc_kit3 < 98 and not is_state('input_boolean.zendure_bypass_kit3', 'on') and not urg_kit3 %}{% set ns.l = ns.l + [soc_kit3] %}{% endif %}{{ ns.l }}"
      min_soc: '{{ list_socs | min if list_socs | length > 0 else 100 }}'
      cibles_count: "{{ list_socs | select('<=', min_soc + 1) | list | length }}"
      part_ac: '{{ [(surplus_net / cibles_count) | round(0), 800] | min if cibles_count > 0 else 0 }}'
      ac_cible_kit1: '{% set seuil = 50 if ac_kit1 > 0 else 120 %}{{ part_ac if bypass_actif and part_ac > seuil and soc_kit1 <= (min_soc + 1) and not urg_kit1 else 0 }}'
      ac_cible_kit2: '{% set seuil = 50 if ac_kit2 > 0 else 120 %}{{ part_ac if bypass_actif and part_ac > seuil and soc_kit2 <= (min_soc + 1) and not urg_kit2 else 0 }}'
      ac_cible_kit3: '{% set seuil = 50 if ac_kit3 > 0 else 120 %}{{ part_ac if bypass_actif and part_ac > seuil and soc_kit3 <= (min_soc + 1) and not urg_kit3 else 0 }}'
      out_kit1: "{{ states('number.zendure_kit1_outputlimit') | float(0) }}"
      out_kit2: "{{ states('number.zendure_kit2_outputlimit') | float(0) }}"
      out_kit3: "{{ states('number.zendure_kit3_outputlimit') | float(0) }}"
      total_out_actuel: '{{ out_kit1 + out_kit2 + out_kit3 }}'
      total_out_cible: '{{ safe_kit1 + safe_kit2 + safe_kit3 }}'
      total_ac_cible: '{{ ac_cible_kit1 + ac_cible_kit2 + ac_cible_kit3 }}'
      delta_global: '{{ (safe_kit1 - out_kit1) | abs + (safe_kit2 - out_kit2) | abs + (safe_kit3 - out_kit3) | abs + (ac_cible_kit1 - ac_kit1) | abs + (ac_cible_kit2 - ac_kit2) | abs + (ac_cible_kit3 - ac_kit3) | abs }}'
  - condition: template
    value_template: |
      {{ delta_global >= (states('input_number.zendure_reglage_seuil_ordre') | float(20))
         or is_cal
         or (total_out_cible == 0 and total_out_actuel > 0)
         or (total_ac_cible == 0 and ac_total > 0) }}
  - parallel:
    - alias: Piloter kit1
      sequence:
      - if:
        - condition: template
          value_template: '{{ not urg_kit1 }}'
        then:
        - if:
          - condition: template
            value_template: '{{ ac_cible_kit1 > 0 }}'
          then:
          - if:
            - condition: template
              value_template: "{{ states('number.zendure_kit1_outputlimit') | float(0) != 0 }}"
            then:
            - action: number.set_value
              continue_on_error: true
              target:
                entity_id: number.zendure_kit1_outputlimit
              data:
                value: 0
          - if:
            - condition: template
              value_template: "{{ states('select.zendure_kit1_acmode') != 'Input mode' }}"
            then:
            - action: select.select_option
              continue_on_error: true
              target:
                entity_id: select.zendure_kit1_acmode
              data:
                option: Input mode
          - if:
            - condition: template
              value_template: "{{ (states('number.zendure_kit1_inputlimit') | float(0) - ac_cible_kit1) | abs >= 15 }}"
            then:
            - action: number.set_value
              continue_on_error: true
              target:
                entity_id: number.zendure_kit1_inputlimit
              data:
                value: '{{ ac_cible_kit1 }}'
          else:
          - if:
            - condition: template
              value_template: "{{ states('number.zendure_kit1_inputlimit') | float(0) != 0 }}"
            then:
            - action: number.set_value
              continue_on_error: true
              target:
                entity_id: number.zendure_kit1_inputlimit
              data:
                value: 0
          - if:
            - condition: template
              value_template: "{{ states('select.zendure_kit1_acmode') == 'Input mode' and safe_kit1 > 0 and not (bypass_actif and solaire_total >= besoin_total) }}"
            then:
            - action: select.select_option
              continue_on_error: true
              target:
                entity_id: select.zendure_kit1_acmode
              data:
                option: Output mode
          - if:
            - condition: template
              value_template: "{{ (safe_kit1 == 0 and states('number.zendure_kit1_outputlimit') | float(0) > 0) or ((safe_kit1 - states('number.zendure_kit1_outputlimit') | float(0)) | abs >= 15) }}"
            then:
            - action: number.set_value
              continue_on_error: true
              target:
                entity_id: number.zendure_kit1_outputlimit
              data:
                value: '{{ safe_kit1 }}'
    - alias: Piloter kit2
      sequence:
      - if:
        - condition: template
          value_template: '{{ not urg_kit2 }}'
        then:
        - if:
          - condition: template
            value_template: '{{ ac_cible_kit2 > 0 }}'
          then:
          - if:
            - condition: template
              value_template: "{{ states('number.zendure_kit2_outputlimit') | float(0) != 0 }}"
            then:
            - action: number.set_value
              continue_on_error: true
              target:
                entity_id: number.zendure_kit2_outputlimit
              data:
                value: 0
          - if:
            - condition: template
              value_template: "{{ states('select.zendure_kit2_acmode') != 'Input mode' }}"
            then:
            - action: select.select_option
              continue_on_error: true
              target:
                entity_id: select.zendure_kit2_acmode
              data:
                option: Input mode
          - if:
            - condition: template
              value_template: "{{ (states('number.zendure_kit2_inputlimit') | float(0) - ac_cible_kit2) | abs >= 15 }}"
            then:
            - action: number.set_value
              continue_on_error: true
              target:
                entity_id: number.zendure_kit2_inputlimit
              data:
                value: '{{ ac_cible_kit2 }}'
          else:
          - if:
            - condition: template
              value_template: "{{ states('number.zendure_kit2_inputlimit') | float(0) != 0 }}"
            then:
            - action: number.set_value
              continue_on_error: true
              target:
                entity_id: number.zendure_kit2_inputlimit
              data:
                value: 0
          - if:
            - condition: template
              value_template: "{{ states('select.zendure_kit2_acmode') == 'Input mode' and safe_kit2 > 0 and not (bypass_actif and solaire_total >= besoin_total) }}"
            then:
            - action: select.select_option
              continue_on_error: true
              target:
                entity_id: select.zendure_kit2_acmode
              data:
                option: Output mode
          - if:
            - condition: template
              value_template: "{{ (safe_kit2 == 0 and states('number.zendure_kit2_outputlimit') | float(0) > 0) or ((safe_kit2 - states('number.zendure_kit2_outputlimit') | float(0)) | abs >= 15) }}"
            then:
            - action: number.set_value
              continue_on_error: true
              target:
                entity_id: number.zendure_kit2_outputlimit
              data:
                value: '{{ safe_kit2 }}'
    - alias: Piloter kit3
      sequence:
      - if:
        - condition: template
          value_template: '{{ not urg_kit3 }}'
        then:
        - if:
          - condition: template
            value_template: '{{ ac_cible_kit3 > 0 }}'
          then:
          - if:
            - condition: template
              value_template: "{{ states('number.zendure_kit3_outputlimit') | float(0) != 0 }}"
            then:
            - action: number.set_value
              continue_on_error: true
              target:
                entity_id: number.zendure_kit3_outputlimit
              data:
                value: 0
          - if:
            - condition: template
              value_template: "{{ states('select.zendure_kit3_acmode') != 'Input mode' }}"
            then:
            - action: select.select_option
              continue_on_error: true
              target:
                entity_id: select.zendure_kit3_acmode
              data:
                option: Input mode
          - if:
            - condition: template
              value_template: "{{ (states('number.zendure_kit3_inputlimit') | float(0) - ac_cible_kit3) | abs >= 15 }}"
            then:
            - action: number.set_value
              continue_on_error: true
              target:
                entity_id: number.zendure_kit3_inputlimit
              data:
                value: '{{ ac_cible_kit3 }}'
          else:
          - if:
            - condition: template
              value_template: "{{ states('number.zendure_kit3_inputlimit') | float(0) != 0 }}"
            then:
            - action: number.set_value
              continue_on_error: true
              target:
                entity_id: number.zendure_kit3_inputlimit
              data:
                value: 0
          - if:
            - condition: template
              value_template: "{{ states('select.zendure_kit3_acmode') == 'Input mode' and safe_kit3 > 0 and not (bypass_actif and solaire_total >= besoin_total) }}"
            then:
