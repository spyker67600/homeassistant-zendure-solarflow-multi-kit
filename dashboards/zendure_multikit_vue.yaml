      entity: input_number.zendure_reglage_coussin_charge_reseau
    - type: tile
      entity: input_number.zendure_reglage_seuil_gros_conso
    - type: tile
      entity: input_number.zendure_reglage_seuil_ordre
    - type: tile
      entity: input_number.zendure_reglage_marge_anti_nuage
    - type: tile
      entity: input_number.zendure_reglage_tampon_bypass
    - type: tile
      entity: input_number.zendure_reglage_marge_soc
    - type: tile
      entity: input_number.zendure_reglage_marge_soc_jour_gris
    - type: tile
      entity: input_number.zendure_reglage_bypass_on
    - type: tile
      entity: input_number.zendure_reglage_bypass_off
    - type: tile
      entity: input_number.zendure_reglage_calibrage_charge
    - type: tile
      entity: input_number.zendure_reglage_calibrage_decharge
    - type: tile
      entity: input_number.zendure_reglage_calibrage_fin
  - type: grid
    cards:
    - type: heading
      heading: Calibrage LFP
      icon: mdi:battery-sync
    - type: tile
      entity: input_boolean.zendure_calibrage_auto
    - type: tile
      entity: input_number.zendure_intervalle_calibrage
    - type: tile
      entity: sensor.zendure_decompte_calibrage_kit1
      name: 'Kit 1 : dans'
    - type: tile
      entity: input_boolean.zendure_armement_calibrage_kit1
      name: 'Kit 1 : armé'
    - type: tile
      entity: sensor.zendure_heure_calibrage_kit1
      name: 'Kit 1 : départ'
    - type: tile
      entity: input_boolean.zendure_calibrage_kit1
      name: 'Kit 1 : en cours'
    - type: tile
      entity: sensor.zendure_decompte_calibrage_kit2
      name: 'Kit 2 : dans'
    - type: tile
      entity: input_boolean.zendure_armement_calibrage_kit2
      name: 'Kit 2 : armé'
    - type: tile
      entity: sensor.zendure_heure_calibrage_kit2
      name: 'Kit 2 : départ'
