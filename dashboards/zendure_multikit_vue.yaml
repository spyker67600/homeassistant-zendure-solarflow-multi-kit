      content: '{{ states(''input_text.zendure_jauge_motif_kit3'') }}'
      visibility:
      - condition: state
        entity: input_boolean.zendure_jauge_suspecte_kit3
        state: 'on'
    - type: tile
      entity: sensor.zendure_kit3_pack_maxvol
      name: Cellule max
    - type: tile
      entity: sensor.zendure_kit3_pack_minvol
      name: Cellule min
    - type: tile
      entity: counter.zendure_commutations_kit3_ac_mode
      name: Commut. AC (jour)
  - type: grid
    cards:
    - type: heading
      heading: Réglages
      icon: mdi:tune-variant
    - type: tile
      entity: input_number.zendure_reglage_coussin_normal
