      entity: input_number.zendure_cible_min_soc_kit3
      name: Min SOC
    - type: tile
      entity: input_boolean.zendure_bypass_kit3
      name: Bypass
    - type: tile
      entity: input_boolean.zendure_jauge_suspecte_kit3
      name: Jauge suspecte
